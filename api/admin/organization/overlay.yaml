overlay: 1.0.0
info:
  title: Atlassian Organization API corrections
  version: 1.0.0
actions:
  # The upstream path uses {userId}, but references accountIdParam. OpenAPI
  # requires the path template and parameter name to match, so generation fails
  # without this correction. Keep the downloaded specification untouched so an
  # upstream update remains easy to review.
  - target: "$['paths']['/v2/orgs/{orgId}/directories/{directoryId}/users/{userId}']['get']['parameters'][2]['$ref']"
    description: Reference a path parameter whose name matches {userId}.
    update: "#/components/parameters/userIdParam"
  - target: "$['components']['parameters']"
    description: Add the matching userId path parameter.
    update:
      userIdParam:
        name: userId
        in: path
        required: true
        schema:
          type: string
  # The upstream group membership operations omit operationId, so
  # oapi-codegen does not generate methods for them without these corrections.
  - target: "$['paths']['/v2/orgs/{orgId}/directories/{directoryId}/groups/{groupId}/memberships']['post']"
    description: Add an operation ID for adding a user to a group.
    update:
      operationId: addUserToGroup
  - target: "$['paths']['/v2/orgs/{orgId}/directories/{directoryId}/groups/{groupId}/memberships/{accountId}']['delete']"
    description: Add an operation ID for removing a user from a group.
    update:
      operationId: removeUserFromGroup
  # The upstream resource-scoped role operations also constrain the account ID
  # to a UUID, which rejects every account ID Atlassian issues.
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/roles/assign']['post']['parameters'][1]['schema']['format']"
    description: Treat the role assign endpoint user ID as an opaque Atlassian account ID.
    remove: true
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/roles/revoke']['post']['parameters'][1]['schema']['format']"
    description: Treat the role revoke endpoint user ID as an opaque Atlassian account ID.
    remove: true
  # The upstream organization-level role operations omit operationId and
  # incorrectly constrain Atlassian account IDs to UUIDs. Account IDs are
  # opaque strings and may use legacy or 712020-prefixed forms.
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/assign']['post']"
    description: Add an operation ID for assigning an organization-level role.
    update:
      operationId: assignOrganizationLevelRole
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/revoke']['post']"
    description: Add an operation ID for revoking an organization-level role.
    update:
      operationId: revokeOrganizationLevelRole
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/assign']['post']['parameters'][1]['schema']['format']"
    description: Treat the assign endpoint user ID as an opaque Atlassian account ID.
    remove: true
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/revoke']['post']['parameters'][1]['schema']['format']"
    description: Treat the revoke endpoint user ID as an opaque Atlassian account ID.
    remove: true
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/assign']['post']['parameters'][0]['schema']['format']"
    description: Keep the assign endpoint organization ID consistent with other Organization API operations.
    remove: true
  - target: "$['paths']['/v1/orgs/{orgId}/users/{userId}/role-assignments/revoke']['post']['parameters'][0]['schema']['format']"
    description: Keep the revoke endpoint organization ID consistent with other Organization API operations.
    remove: true
