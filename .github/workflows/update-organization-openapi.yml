name: Update Organization OpenAPI client

on:
  schedule:
    # Check for upstream specification changes once a week, every Monday at 01:17 UTC.
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update specification and generated client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and validate upstream specification
        run: |
          curl --fail --silent --show-error --location \
            https://dac-static.atlassian.com/cloud/admin/organization/swagger.v3.json \
            --output /tmp/atlassian-organization-openapi.json
          jq --exit-status '.openapi == "3.0.0" and (.paths | type == "object")' \
            /tmp/atlassian-organization-openapi.json >/dev/null
          cp /tmp/atlassian-organization-openapi.json api/admin/organization/upstream.json
      - run: make generate/api-client
      - name: Create update pull request
        uses: peter-evans/create-pull-request@5f69787676f0cd94f5880a2d7fdf9af523b50b8f # v8.1.1
        with:
          branch: automation/update-atlassian-organization-openapi
          delete-branch: true
          commit-message: "chore: update Atlassian Organization OpenAPI client"
          title: "chore: update Atlassian Organization OpenAPI client"
          body: |
            Updates the vendored Atlassian Organization OpenAPI specification
            and regenerates the selected API client operations.
